[project]
name = "fpa-for-tsfm"
version = "0.1.0"
description = "Forking Paths Analysis for time-series foundation models using Chronos-T5."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "torch==2.11.0",
    "transformers==5.12.1",
    "datasets==5.0.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
